name: Release

# A v* tag publishes a GitHub release. A manual run only builds and keeps the APK as a workflow artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Read version
        id: version
        run: |
          NAME=$(sed -nE 's/^ *versionName = "(.+)"/\1/p' app/build.gradle.kts)
          test -n "$NAME" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $NAME"; exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          BRIGHT_KEYSTORE_BASE64: ${{ secrets.BRIGHT_KEYSTORE_BASE64 }}
        run: |
          test -n "$BRIGHT_KEYSTORE_BASE64" || { echo "BRIGHT_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$BRIGHT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "BRIGHT_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          BRIGHT_STORE_PASSWORD: ${{ secrets.BRIGHT_STORE_PASSWORD }}
          BRIGHT_KEY_ALIAS: ${{ secrets.BRIGHT_KEY_ALIAS }}
          BRIGHT_KEY_PASSWORD: ${{ secrets.BRIGHT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease

      - name: Collect APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "No signed APK, check the signing secrets"; exit 1; }
          mkdir dist
          cp "$APK" "dist/bright-${{ steps.version.outputs.name }}.apk"
          # Stable name so download links and Downloader codes never change between releases
          cp "$APK" dist/bright.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v5
        if: github.ref_type != 'tag'
        with:
          name: bright-${{ steps.version.outputs.name }}
          path: dist/
          retention-days: 7

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Bright ${{ steps.version.outputs.name }}" --generate-notes
